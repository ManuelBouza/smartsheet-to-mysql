services:
  mysql:
    image: mysql:8.4
    container_name: smartsheet_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartsheet
      MYSQL_USER: smartsheet
      MYSQL_PASSWORD: smartsheet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
